<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>JEANNE D'ARC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0a1622;font-family:Arial,sans-serif;user-select:none;-webkit-user-select:none}
.screen{width:1024px;height:600px;position:absolute;top:50%;left:50%;transform-origin:center center;overflow:hidden;background:#0a1622}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:1}
.barco-wrap{position:absolute;inset:0;z-index:2}
.barco-wrap.pitching{animation:cabeceo 5s ease-in-out infinite;transform-origin:50% 62%}
@keyframes cabeceo{
  0%{transform:rotate(0deg) translateY(0px)}
  25%{transform:rotate(-0.8deg) translateY(-2px)}
  50%{transform:rotate(0deg) translateY(0px)}
  75%{transform:rotate(0.8deg) translateY(-1px)}
  100%{transform:rotate(0deg) translateY(0px)}
}
.barco-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center 62%;z-index:2;pointer-events:none}
.luz-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.cabo-svg{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
/* STATUSBAR */
.statusbar{position:absolute;top:0;left:0;right:0;height:28px;background:rgba(3,14,26,0.55);backdrop-filter:blur(6px);display:flex;align-items:center;padding:0 14px;gap:7px;z-index:20}
.s-time{font-size:13px;font-weight:bold;color:white;letter-spacing:1px}
.s-gps-lbl{font-size:9px;color:#7dd4f0;letter-spacing:.5px}
.s-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.s-green{background:#2ecc71;box-shadow:0 0 4px #2ecc71}
.s-red{background:#e74c3c;box-shadow:0 0 4px #e74c3c}
.s-spacer{flex:1}
.s-bars{display:flex;align-items:flex-end;gap:2px}
.s-bars span{background:white;border-radius:1px;width:4px}
.s-nogps{font-size:9px;color:#e74c3c;letter-spacing:.5px;font-style:italic;display:none}
.s-speed,.s-heading{background:white;border-radius:4px;padding:1px 6px;display:none;align-items:center;gap:3px}
.s-speed-val,.s-heading-val{font-family:'Arial Black',Arial,sans-serif;font-size:14px;font-weight:900;color:#0a1622;line-height:1}
.s-speed-unit,.s-heading-unit{font-size:7px;color:#0a1622;letter-spacing:1px}
.navegando .s-speed,.navegando .s-heading{display:flex}
/* TITLE */
.title{position:absolute;bottom:88px;left:14px;text-align:left;z-index:15;pointer-events:none}
.title h1{font-family:Georgia,serif;font-size:26px;font-weight:bold;color:white;letter-spacing:6px;text-shadow:0 1px 12px rgba(0,0,0,0.6)}
.title .sub{font-size:10px;color:rgba(255,255,255,0.65);letter-spacing:5px;margin-top:3px;font-family:'Arial Narrow',Arial,sans-serif;text-shadow:0 1px 6px rgba(0,0,0,0.5)}
/* PANELS */
.panel{position:absolute;top:95px;z-index:15;width:156px;height:175px;background:rgba(3,14,26,0.72);border-radius:10px;border:0.5px solid rgba(255,255,255,0.12);display:none;flex-direction:column;align-items:center;backdrop-filter:blur(4px)}
.navegando .panel{display:flex}
.p-left{left:14px}.p-right{right:14px}
.p-label{font-size:10px;color:#7dd4f0;letter-spacing:2.5px;margin-top:14px;font-family:'Arial Narrow',Arial,sans-serif;text-transform:uppercase}
.p-box{background:white;border-radius:5px;width:136px;height:80px;display:flex;align-items:center;justify-content:center;margin-top:7px;box-shadow:0 2px 8px rgba(0,0,0,0.25)}
.p-val{font-family:'Arial Black',Arial,sans-serif;font-size:54px;font-weight:900;color:#0a1622;line-height:1}
.p-val.small{font-size:42px}
.p-unit{font-size:12px;color:#7dd4f0;letter-spacing:2.5px;margin-top:5px;font-family:'Arial Narrow',Arial,sans-serif}
.p-status{display:flex;align-items:center;gap:5px;margin-top:6px}
.p-txt{font-size:8px;color:rgba(255,255,255,0.45)}
/* ICONBAR */
.iconbar{position:absolute;bottom:0;left:0;right:0;height:80px;background:rgba(3,12,22,0.82);border-top:0.5px solid rgba(255,255,255,0.1);z-index:20;display:flex;align-items:center;justify-content:space-evenly;padding:0 8px;backdrop-filter:blur(6px)}
.icon-btn{display:flex;flex-direction:column;align-items:center;gap:4px;width:108px;height:66px;justify-content:center;cursor:pointer;border-radius:8px;transition:background 0.15s;position:relative}
.icon-btn:active{background:rgba(255,255,255,0.1)}
.icon-box{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.5);pointer-events:none}
.icon-btn .lbl{font-size:9px;color:rgba(255,255,255,0.6);letter-spacing:.3px;text-transform:uppercase;pointer-events:none}
.icon-btn-empty{opacity:.5}
.icon-box-empty{border:1.5px dashed rgba(255,255,255,0.25)!important;background:transparent!important;box-shadow:none!important}
/* CONTEXT MENU */
.ctx-menu{position:fixed;z-index:100;background:rgba(10,22,34,0.96);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:6px 0;min-width:200px;box-shadow:0 4px 20px rgba(0,0,0,0.7);display:none;backdrop-filter:blur(8px);top:50%!important;left:50%!important;transform:translate(-50%,-50%)}
.ctx-menu.open{display:block}
.ctx-item{padding:13px 20px;color:rgba(255,255,255,0.85);font-size:13px;cursor:pointer;transition:background 0.1s}
.ctx-item:active{background:rgba(255,255,255,0.1)}
.ctx-sep{height:1px;background:rgba(255,255,255,0.1);margin:4px 0}
/* PICKERS */
.overlay{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,0.85);display:none;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.picker-box{background:rgba(10,22,34,0.98);border:1px solid rgba(255,255,255,0.15);border-radius:14px;padding:20px;max-width:620px;width:92%;max-height:480px;overflow-y:auto}
.picker-title{color:#7dd4f0;font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:16px;text-align:center}
.app-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.app-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:8px;cursor:pointer;transition:background 0.1s;color:rgba(255,255,255,0.8);font-size:10px;text-align:center}
.app-item:active{background:rgba(255,255,255,0.1)}
.app-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.picker-close{margin-top:16px;text-align:center;color:rgba(255,255,255,0.4);font-size:12px;cursor:pointer;padding:8px}
.swap-list{display:flex;flex-direction:column;gap:6px}
.swap-item{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:8px;cursor:pointer;transition:background 0.1s;color:rgba(255,255,255,0.85);font-size:13px}
.swap-item:active{background:rgba(255,255,255,0.1)}
.swap-num{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:11px;color:#7dd4f0;flex-shrink:0}
</style>
</head>
<body>

<div class="screen" id="screen">
  <img class="bg" id="bgImg" src="" alt="">

  <div class="barco-wrap" id="barcoWrap">
    <svg class="luz-svg" id="mastilSvg" viewBox="0 0 1024 600" xmlns="http://www.w3.org/2000/svg" style="display:none">
      <defs>
        <filter id="glow-w" x="-400%" y="-400%" width="900%" height="900%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-bc" x="-400%" y="-400%" width="900%" height="900%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle id="luzBlanca" cx="487" cy="56" r="6" fill="white" filter="url(#glow-w)" style="display:none"/>
      <path id="luzRoja"  d="M487 50 A6 6 0 0 0 487 62 Z" fill="#ff2020" filter="url(#glow-bc)" style="display:none"/>
      <path id="luzVerde" d="M487 50 A6 6 0 0 1 487 62 Z" fill="#00dd44" filter="url(#glow-bc)" style="display:none"/>
    </svg>
    <img class="barco-img" id="barcoImg" src="" alt="">
  </div>
  <div id="imgDiag" style="position:absolute;top:30px;left:4px;z-index:99;font-size:10px;color:#0f0;background:rgba(0,0,0,0.5);padding:2px 4px;font-family:monospace"></div>

  <svg class="cabo-svg" id="caboSvg" viewBox="0 0 1024 600" xmlns="http://www.w3.org/2000/svg" style="display:none">
    <line id="caboLine" x1="337" y1="425" x2="293" y2="463"
          stroke="#6b4423" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
  </svg>

  <div class="statusbar">
    <span class="s-time" id="clk">--:--</span>
    <span class="s-gps-lbl">GPS</span>
    <div class="s-dot" id="gpsDot"></div>
    <span class="s-nogps" id="gpsNoSig"></span>
    <div class="s-spacer"></div>
    <div class="s-bars">
      <span style="height:6px"></span><span style="height:10px"></span>
      <span style="height:14px"></span><span style="height:18px;opacity:.25"></span>
    </div>
    <svg width="18" height="14" viewBox="0 0 16 13" fill="none" style="margin-left:6px;opacity:.8">
      <path d="M1,4 Q8,-1 15,4" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <path d="M3.5,7.5 Q8,4 12.5,7.5" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <circle cx="8" cy="11" r="1.5" fill="white"/>
    </svg>
  </div>

  <div class="title"><h1>JEANNE D'ARC</h1><div class="sub">HR 350</div></div>

  <div class="panel p-left" id="panelSp">
    <div class="p-label">Velocidad</div>
    <div class="p-box"><span class="p-val" id="spVal">--</span></div>
    <div class="p-unit">NUDOS</div>
  </div>
  <div class="panel p-right" id="panelHd">
    <div class="p-label">Rumbo</div>
    <div class="p-box"><span class="p-val small" id="hdVal">--&#176;</span></div>
    <div class="p-unit">GRADOS</div>
  </div>

  <div class="iconbar" id="iconbar"></div>
</div>

<!-- Context menu -->
<div class="ctx-menu" id="ctxMenu">
  <div class="ctx-item" id="ctxChange">Cambiar app</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" id="ctxSwap">Intercambiar con&#8230;</div>
</div>

<!-- App picker -->
<div class="overlay" id="appPicker">
  <div class="picker-box">
    <div class="picker-title">Seleccionar aplicaci&#243;n</div>
    <div class="app-grid" id="appGrid"></div>
    <div class="picker-close" id="appClose">&#x2715; Cancelar</div>
  </div>
</div>

<!-- Swap picker -->
<div class="overlay" id="swapPicker">
  <div class="picker-box" style="max-width:440px">
    <div class="picker-title">Intercambiar con bot&#243;n&#8230;</div>
    <div class="swap-list" id="swapList"></div>
    <div class="picker-close" id="swapClose">&#x2715; Cancelar</div>
  </div>
</div>

// -- Android bridge --
var Bridge = window.Android || null;

function launchApp(pkg) {
  if (Bridge) { Bridge.launchApp(pkg); return; }
  console.log("Launch:", pkg);
}
function savePrefs(k, v) {
  var s = typeof v === "object" ? JSON.stringify(v) : String(v);
  try { localStorage.setItem(k, s); } catch(e) {}
  if (Bridge) try { Bridge.savePrefs(k, s); } catch(e) {}
}
function loadPrefs(k) {
  if (Bridge) try { var v=Bridge.loadPrefs(k); if(v) return v; } catch(e) {}
  try { return localStorage.getItem(k); } catch(e) { return null; }
}
function getInstalledApps() {
  if (Bridge) try { return JSON.parse(Bridge.getInstalledApps()); } catch(e) {}
  return FALLBACK_APPS;
}
function openNativeLauncher() {
  if (Bridge) Bridge.openLauncher();
}

// Load saved buttons

    if(s){ var p=JSON.parse(s); if(Array.isArray(p)&&p.length===7) btns=p; }
  } catch(e){}
})();

// -- Render iconbar --
function renderBar(){
  var bar=document.getElementById("iconbar");
  bar.innerHTML="";
  btns.forEach(function(b,i){
    var d=document.createElement("div");
    d.className="icon-btn"+(b.empty?" icon-btn-empty":"");
    d.dataset.i=i;
    var box=document.createElement("div");
    box.className="icon-box"+(b.empty?" icon-box-empty":"");
    box.style.background=b.bg||"transparent";
    if(b.border) box.style.border=b.border;
    if(b.iconUrl) box.innerHTML='<img src="'+b.iconUrl+'" width="30" height="30" style="border-radius:6px">';
    else box.innerHTML=b.svg||"";
    var lbl=document.createElement("span");
    lbl.className="lbl";
    if(b.empty) lbl.style.color="rgba(255,255,255,0.3)";
    lbl.textContent=b.lbl;
    d.appendChild(box); d.appendChild(lbl); bar.appendChild(d);

    d.addEventListener("pointerdown",function(e){
      lpIdx=i;
      lpTimer=setTimeout(function(){ lpTimer=null; showCtx(i,e.clientX,e.clientY); },LP_MS);
    });
    d.addEventListener("pointerup",function(e){
      if(!lpTimer) return; // long-press already fired
      clearTimeout(lpTimer); lpTimer=null;
      e.stopPropagation();
      tapBtn(i);
    });
    ["pointerleave","pointercancel"].forEach(function(ev){
      d.addEventListener(ev,function(){ if(lpTimer){clearTimeout(lpTimer);lpTimer=null;} });
    });
  });
}

function tapBtn(i){
  var b=btns[i]; if(!b||b.empty) return;
  if(b.pkg==="__LAUNCHER__"){ openNativeLauncher(); return; }
  if(b.pkg==="__EMPTY__") return;
  launchApp(b.pkg);
}

// -- Context menu --
function showCtx(i,x,y){
  ctxIdx=i;
  var m=document.getElementById("ctxMenu");
  m.style.left=Math.min(x,824)+"px";
  m.style.top=Math.min(y,480)+"px";
  m.classList.add("open");
}
function hideCtx(){ document.getElementById("ctxMenu").classList.remove("open"); }

document.getElementById("ctxChange").addEventListener("click",function(){ hideCtx(); openAppPicker(ctxIdx); });
document.getElementById("ctxSwap").addEventListener("click",function(){ hideCtx(); openSwapPicker(ctxIdx); });
document.addEventListener("pointerdown",function(e){ if(!e.target.closest("#ctxMenu")) hideCtx(); });

// -- App picker --
var picIdx=null;
function openAppPicker(i){
  picIdx=i;
  var grid=document.getElementById("appGrid");
  grid.innerHTML="";
  var empty=document.createElement("div");
  empty.className="app-item";
  empty.innerHTML='<div class="app-icon" style="background:rgba(255,255,255,0.08)">&#x2715;</div><span>Vaciar</span>';
  empty.addEventListener("click",function(){ clearBtn(picIdx); closeAppPicker(); });
  grid.appendChild(empty);
  getInstalledApps().forEach(function(app){
    var el=document.createElement("div");
    el.className="app-item";
    var ih=app.iconUrl?'<img src="'+app.iconUrl+'" width="30" height="30" style="border-radius:6px">':(app.icon||"&#x1F4F1;");
    el.innerHTML='<div class="app-icon" style="background:rgba(255,255,255,0.08)">'+ih+'</div><span>'+app.name+'</span>';
    el.addEventListener("click",function(){ assignApp(picIdx,app); closeAppPicker(); });
    grid.appendChild(el);
  });
  document.getElementById("appPicker").classList.add("open");
}
function closeAppPicker(){ document.getElementById("appPicker").classList.remove("open"); }
document.getElementById("appClose").addEventListener("click",closeAppPicker);

function assignApp(i,app){
  btns[i]={id:i,lbl:app.name,pkg:app.pkg,empty:false,
    bg:"rgba(255,255,255,0.12)",border:null,
    iconUrl:app.iconUrl||null,
    svg:app.iconUrl?"":'<span style="font-size:20px">'+(app.icon||"&#x1F4F1;")+"</span>"};
  savePrefs("jdBtns",btns); renderBar();
}
function clearBtn(i){
  btns[i]=Object.assign({},DEFAULT_BTNS[6],{id:i});
  savePrefs("jdBtns",btns); renderBar();
}

// -- Swap picker --
var swapSrc=null;
function openSwapPicker(i){
  swapSrc=i;
  var list=document.getElementById("swapList");
  list.innerHTML="";
  btns.forEach(function(b,j){
    if(j===i) return;
    var el=document.createElement("div");
    el.className="swap-item";
    el.innerHTML='<div class="swap-num">'+(j+1)+'</div><span>'+b.lbl+'</span>';
    el.addEventListener("click",function(){ swapBtns(swapSrc,j); closeSwapPicker(); });
    list.appendChild(el);
  });
  document.getElementById("swapPicker").classList.add("open");
}
function closeSwapPicker(){ document.getElementById("swapPicker").classList.remove("open"); }
document.getElementById("swapClose").addEventListener("click",closeSwapPicker);

function swapBtns(a,b){
  var tmp=btns[a]; btns[a]=btns[b]; btns[b]=tmp;
  savePrefs("jdBtns",btns); renderBar();
}

  curMode=mode;
  var screen=document.getElementById("screen");
  var wrap=document.getElementById("barcoWrap");
  var bImg=document.getElementById("barcoImg");
  var bg=document.getElementById("bgImg");
  var cabo=document.getElementById("caboSvg");
  var caboL=document.getElementById("caboLine");
  var mast=document.getElementById("mastilSvg");
  var lB=document.getElementById("luzBlanca");
  var lR=document.getElementById("luzRoja");
  var lV=document.getElementById("luzVerde");

  isNavigating?screen.classList.add("navegando"):screen.classList.remove("navegando");
  isNavigating?wrap.classList.add("pitching"):wrap.classList.remove("pitching");

  bg.src   = isNight ? IMG.bgNight  : IMG.bgDay;
  bImg.src = isNavigating ? IMG.shipSail : IMG.shipNosail;

  cabo.style.display=isNavigating?"none":"block";
  caboL.setAttribute("stroke", isNight?"#5a3010":"#6b4423");

  mast.style.display=isNight?"block":"none";
  lB.style.display=(isNight&&!isNavigating)?"block":"none";
  lR.style.display=(isNight&&isNavigating)?"block":"none";
  lV.style.display=(isNight&&isNavigating)?"block":"none";
}

// -- GPS --
function onGpsPos(pos){
  gpsOk=true;
  var spd=pos.coords.speed!=null?pos.coords.speed*1.94384:0;
  var hdg=pos.coords.heading!=null?pos.coords.heading:0;
  document.getElementById("gpsDot").className="s-dot s-green";
  document.getElementById("gpsNoSig").style.display="none";
  var spStr=spd.toFixed(1), hdStr=Math.round(hdg)+"°";
  document.getElementById("spVal").textContent=spStr;
  document.getElementById("hdVal").textContent=hdStr;
  updateDayNight(pos.coords.latitude, pos.coords.longitude);
  handleSpeed(spd);
}
function onGpsErr(){
  gpsOk=false;
  document.getElementById("gpsDot").className="s-dot s-red";
  var ns=document.getElementById("gpsNoSig");
  ns.style.display=""; ns.textContent="-sin señal-";
  ["spVal","hdVal"].forEach(function(id){ document.getElementById(id).textContent="--"; });
  updateDayNightByTime();
}
function handleSpeed(spd){
  var shouldNav=spd>SPTHRESH;
  if(shouldNav===isNavigating){ if(navTimer){clearTimeout(navTimer);navTimer=null;} return; }
  if(!navTimer){ navTimer=setTimeout(function(){ navTimer=null; isNavigating=shouldNav; applyMode(); },DELAY); }
}

// -- Sunrise/sunset (NOAA simplified) --
function updateDayNight(lat,lon){
  var now=new Date();
  var st=sunTimes(lat,lon,now);
  var m=now.getHours()*60+now.getMinutes();
  isNight=!(m>=st.rise&&m<st.set);
  applyMode();
}
function updateDayNightByTime(){
  var h=new Date().getHours();
  isNight=(h>=20||h<6);
  applyMode();
}
function sunTimes(lat,lon,date){
  var R=Math.PI/180;
  var doy=Math.floor((date-new Date(date.getFullYear(),0,0))/86400000);
  function calc(rising){
    var lh=lon/15;
    var t=rising?doy+(6-lh)/24:doy+(18-lh)/24;
    var M=0.9856*t-3.289;
    var L=M+1.916*Math.sin(M*R)+0.02*Math.sin(2*M*R)+282.634;
    L=((L%360)+360)%360;
    var RA=Math.atan(0.91764*Math.tan(L*R))/R;
    RA=((RA%360)+360)%360;
    RA=(RA+Math.floor(L/90)*90-Math.floor(RA/90)*90)/15;
    var sinD=0.39782*Math.sin(L*R);
    var cosD=Math.cos(Math.asin(sinD));
    var cosH=(Math.cos(90.833*R)-sinD*Math.sin(lat*R))/(cosD*Math.cos(lat*R));
    if(cosH>1) return rising?0:1439;
    if(cosH<-1) return rising?0:1439;
    var H=rising?360-Math.acos(cosH)/R:Math.acos(cosH)/R;
    var T=H/15+RA-0.06571*t-6.622;
    var UT=((T-lh)%24+24)%24;
    var local=UT-date.getTimezoneOffset()/60;
    return Math.round(((local%24)+24)%24*60);
  }
  return {rise:calc(true),set:calc(false)};
}

// -- Clock --
function tick(){
  var now=new Date();
  document.getElementById("clk").textContent=
    String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  if(!gpsOk) updateDayNightByTime();
}

// -- Init --
function init(){
  renderBar();
  updateDayNightByTime();
  applyMode();
  if(navigator.geolocation){
    navigator.geolocation.watchPosition(onGpsPos,onGpsErr,{
      enableHighAccuracy:true, maximumAge:5000, timeout:10000
    });
  } else { onGpsErr(); }
  setInterval(tick,1000); tick();
}
init();

function scaleToFit(){
  var s=document.getElementById("screen");
  var scale=Math.min(window.innerWidth/1024, window.innerHeight/600);
  s.style.transform="translate(-50%,-50%) scale("+scale+")";
}
scaleToFit();
window.addEventListener("resize",scaleToFit);

// -- Calibration tool --
(function(){
  var CAL_KEY="jdCalib";
  var calOpen=false;
  // Default positions stored as fractions of the boat's rendered rect (1288x728 -> 1024x578.8 at top=13.2)
  // Calibrated: caboX1=337,caboY1=425,caboX2=293,caboY2=463,luzX=487,luzY=56
  var BOAT_DEF={left:0,top:13.2,w:1024,h:578.8};
  var CAL_REL={c1x:337/1024,c1y:(425-13.2)/578.8, c2x:293/1024,c2y:(463-13.2)/578.8, lx:487/1024,ly:(56-13.2)/578.8};
  var calData={caboX1:337,caboY1:425,caboX2:293,caboY2:463,luzX:487,luzY:56};

  // Recalculate screen coords from boat-relative fractions based on actual rendered image size
  function recalcFromBoat(){
    var img=document.getElementById("barcoImg");
    if(!img.naturalWidth) return;
    var scl=Math.min(1024/img.naturalWidth,600/img.naturalHeight);
    var rW=img.naturalWidth*scl, rH=img.naturalHeight*scl;
    var rL=(1024-rW)/2, rT=(600-rH)*0.62;
    calData.caboX1=Math.round(CAL_REL.c1x*rW+rL); calData.caboY1=Math.round(CAL_REL.c1y*rH+rT);
    calData.caboX2=Math.round(CAL_REL.c2x*rW+rL); calData.caboY2=Math.round(CAL_REL.c2y*rH+rT);
    calData.luzX=Math.round(CAL_REL.lx*rW+rL);    calData.luzY=Math.round(CAL_REL.ly*rH+rT);
    applyCalib();
  }
  document.getElementById("barcoImg").addEventListener("load", recalcFromBoat);
  document.getElementById("barcoImg").addEventListener("load", function(){
    var img=document.getElementById("barcoImg");
    document.getElementById("imgDiag").textContent="IMG OK "+img.naturalWidth+"x"+img.naturalHeight;
  });
  document.getElementById("barcoImg").addEventListener("error", function(){
    document.getElementById("imgDiag").textContent="IMG ERROR";
  });
  try{ var s=localStorage.getItem(CAL_KEY); if(s) calData=JSON.parse(s); }catch(e){}

  function applyCalib(){
    var cl=document.getElementById("caboLine");
    cl.setAttribute("x1",calData.caboX1); cl.setAttribute("y1",calData.caboY1);
    cl.setAttribute("x2",calData.caboX2); cl.setAttribute("y2",calData.caboY2);
    var lx=calData.luzX, ly=calData.luzY;
    document.getElementById("luzBlanca").setAttribute("cx",lx);
    document.getElementById("luzBlanca").setAttribute("cy",ly);
    document.getElementById("luzRoja").setAttribute("d","M"+lx+" "+(ly-6)+" A6 6 0 0 0 "+lx+" "+(ly+6)+" Z");
    document.getElementById("luzVerde").setAttribute("d","M"+lx+" "+(ly-6)+" A6 6 0 0 1 "+lx+" "+(ly+6)+" Z");
  }
  applyCalib();

  // Overlay HTML
  var ov=document.createElement("div");
  ov.id="calOv";
  ov.style.cssText="position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.85);display:none;flex-direction:column;align-items:center;justify-content:center";
  ov.innerHTML=[
    '<div style="color:#7dd4f0;font-size:11px;letter-spacing:3px;margin-bottom:10px;text-transform:uppercase">Calibración de posiciones</div>',
    '<div style="position:relative;width:1024px;height:600px;overflow:hidden;border:1px solid rgba(255,255,255,0.2)" id="calCanvas">',
    '  <img id="calBg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">',
    '  <img id="calShip" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center 62%">',
    '  <svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 1024 600" id="calSvg">',
    '    <line id="calCaboPreview" stroke="#6b4423" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>',
    '    <circle id="calDotC1" r="10" fill="#ff0" stroke="white" stroke-width="2" cursor="grab"/>',
    '    <circle id="calDotC2" r="10" fill="#f80" stroke="white" stroke-width="2" cursor="grab"/>',
    '    <circle id="calDotLuz" r="10" fill="#0df" stroke="white" stroke-width="2" cursor="grab"/>',
    '    <text x="512" y="30" fill="rgba(255,255,255,0.5)" font-size="10" text-anchor="middle" font-family="Arial">',
    '      🟡 Cabo inicio  🟠 Cabo fin  🔵 Luz mástil — Arrastrá los puntos</text>',
    '  </svg>',
    '</div>',
    '<div style="display:flex;gap:14px;margin-top:12px">',
    '  <div id="calSave" style="background:#2ecc71;color:#000;padding:10px 28px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:bold">Guardar</div>',
    '  <div id="calCancel" style="background:rgba(255,255,255,0.15);color:white;padding:10px 28px;border-radius:8px;cursor:pointer;font-size:13px">Cancelar</div>',
    '</div>'
  ].join("");
  document.body.appendChild(ov);

  function openCal(){
    calOpen=true;
    ov.style.display="flex";
    document.getElementById("calBg").src=IMG.bgDay;
    document.getElementById("calShip").src=IMG.shipNosail;
    updateCalDots();
  }
  function closeCal(){ calOpen=false; ov.style.display="none"; }

  function updateCalDots(){
    var d=calData;
    var c1=document.getElementById("calDotC1");
    c1.setAttribute("cx",d.caboX1); c1.setAttribute("cy",d.caboY1);
    var c2=document.getElementById("calDotC2");
    c2.setAttribute("cx",d.caboX2); c2.setAttribute("cy",d.caboY2);
    var lz=document.getElementById("calDotLuz");
    lz.setAttribute("cx",d.luzX); lz.setAttribute("cy",d.luzY);
    var cp=document.getElementById("calCaboPreview");
    cp.setAttribute("x1",d.caboX1); cp.setAttribute("y1",d.caboY1);
    cp.setAttribute("x2",d.caboX2); cp.setAttribute("y2",d.caboY2);
  }

  // Drag logic
  var dragging=null;
  function svgCoords(e, svgEl){
    var r=svgEl.getBoundingClientRect();
    return { x:Math.round((e.clientX-r.left)/r.width*1024),
             y:Math.round((e.clientY-r.top)/r.height*600) };
  }
  ["calDotC1","calDotC2","calDotLuz"].forEach(function(id){
    document.getElementById(id).addEventListener("pointerdown",function(e){
      e.stopPropagation(); dragging=id; this.setPointerCapture(e.pointerId);
    });
  });
  document.getElementById("calSvg").addEventListener("pointermove",function(e){
    if(!dragging) return;
    var p=svgCoords(e,this);
    if(dragging==="calDotC1"){ calData.caboX1=p.x; calData.caboY1=p.y; }
    else if(dragging==="calDotC2"){ calData.caboX2=p.x; calData.caboY2=p.y; }
    else if(dragging==="calDotLuz"){ calData.luzX=p.x; calData.luzY=p.y; }
    updateCalDots();
  });
  document.getElementById("calSvg").addEventListener("pointerup",function(){ dragging=null; });

  document.getElementById("calSave").addEventListener("click",function(){
    try{ localStorage.setItem(CAL_KEY,JSON.stringify(calData)); }catch(e){}
    applyCalib(); closeCal();
  });
  document.getElementById("calCancel").addEventListener("click",function(){ closeCal(); });

  // Trigger: triple-tap on title
  var tapCount=0, tapTimer=null;
  document.getElementById("screen").addEventListener("pointerdown",function(e){
    if(e.target.closest("#iconbar")||e.target.closest(".ctx-menu")||e.target.closest(".overlay")) return;
    if(e.clientY > window.innerHeight*0.3) return;
    tapCount++;
    if(tapTimer) clearTimeout(tapTimer);
    tapTimer=setTimeout(function(){ tapCount=0; },800);
    if(tapCount>=3){ tapCount=0; clearTimeout(tapTimer); openCal(); }
  });
})();
</script>
